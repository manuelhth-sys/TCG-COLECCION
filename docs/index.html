<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1220">
<title>Mi Coleccion TCG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Coleccion">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 id="gameTitle">🏴‍☠️ Mi Coleccion</h1>
    <button id="menuBtn" class="icon-btn" aria-label="Opciones">⋮<span id="backupBadge" class="badge-dot" hidden></span></button>
  </div>

  <div class="game-tabs" id="gameTabs">
    <button class="game-tab active" data-game="onepiece">
      <img class="game-tab-logo" src="logos/onepiece-logo.png" alt="One Piece">
    </button>
    <button class="game-tab" data-game="pokemon">
      <img class="game-tab-logo" src="logos/pokemon-logo.png" alt="Pokemon">
    </button>
  </div>

  <div class="summary" id="overallSummary">
    <div class="summary-text"><span id="overallCount">0 / 0</span> cartas obtenidas &middot; valor <span id="overallValue">$0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="overallFill"></div></div>
    <button id="topCardBtn" class="top-card-link" hidden>
      <img id="topCardImg" class="tc-thumb" src="" alt="">
      <span class="tc-text">
        <span class="tc-label">🏆 Tu carta mas cara</span>
        <span id="topCardName" class="tc-name"></span>
        <span id="topCardPrice" class="tc-price"></span>
      </span>
    </button>
  </div>

  <div class="search-row">
    <input id="searchInput" type="search" inputmode="search" placeholder="Buscar por nombre o codigo (ej: Luffy, OP01-005)" autocomplete="off">
    <button id="clearSearch" class="icon-btn" aria-label="Limpiar busqueda" hidden>✕</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">Todas</button>
    <button class="filter-btn" data-filter="owned">Obtenidas</button>
    <button class="filter-btn" data-filter="missing">Faltantes</button>
  </div>

  <select id="seriesSelect" class="series-select" hidden></select>

  <nav class="set-tabs" id="setTabs"></nav>
</header>

<main id="grid" class="grid"></main>

<p id="emptyState" class="empty-state" hidden>No se encontraron cartas.</p>

<div id="menuSheet" class="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-content">
    <h2>Opciones</h2>
    <div id="backupWarning" class="sheet-warning" hidden></div>
    <div id="topCardStat" class="sheet-stat"></div>
    <button id="exportBtn" class="sheet-btn">⬇️ Exportar coleccion (backup)</button>
    <label class="sheet-btn" for="importFile">⬆️ Importar coleccion</label>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button id="resetSetBtn" class="sheet-btn danger">🗑️ Vaciar set actual</button>
    <button id="qrToggleBtn" class="sheet-btn">📱 Compartir enlace (QR)</button>
    <div id="qrBox" class="qr-box" hidden>
      <div id="qrCanvas" class="qr-canvas"></div>
      <div id="qrUrl" class="qr-url"></div>
    </div>
    <div class="theme-picker-label">Tema visual</div>
    <div class="theme-swatches" id="themeSwatches"></div>
    <button id="closeSheet" class="sheet-btn close">Cerrar</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="confirmDialog" class="confirm-overlay" hidden>
  <div class="confirm-box">
    <img id="confirmImg" class="confirm-img" src="" alt="">
    <button id="confirmInterestBtn" class="interest-pin-btn" hidden>📌 Marcar de interes</button>
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button id="confirmCancelBtn" class="confirm-btn cancel">Cancelar</button>
      <button id="confirmOkBtn" class="confirm-btn ok">Confirmar</button>
    </div>
  </div>
</div>

<div id="zoomOverlay" class="zoom-overlay" hidden>
  <button id="zoomCloseBtn" class="zoom-close-btn">✕</button>
  <button id="zoomResetBtn" class="zoom-reset-btn" hidden>↺ Restablecer</button>
  <div class="zoom-img-wrap">
    <img id="zoomImg" src="" alt="">
  </div>
  <div id="zoomCaption" class="zoom-caption"></div>
</div>

<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
